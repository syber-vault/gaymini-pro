services:
  - type: web
    name: gaymini-pro
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
    startCommand: python run_server.py
    healthCheckPath: /api/gemini/accounts
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # NOTE: do NOT set PORT here — Render injects its own PORT env var and
      # routes traffic to it. A hardcoded PORT would make the service listen
      # on the wrong port and fail health checks.
